# Wdrożenie envs/dev po merge'u do main (albo ręcznie: Actions → Deploy → Run workflow).
#   1. build i push obrazu inference (tylko gdy zmienił się jego kod; tag = SHA commita),
#   2. terraform plan → bezpiecznik (nic nie może być usuwane) → apply,
#   3. tylko gdy powstała nowa wersja Lambdy: scripts/deploy_inference.py (rozgrzanie, test dymny, alias champion),
#   4. zawsze: test publicznego POST /evaluate (ścieżka klienta przez API Gateway).
# Job działa w GitHub Environment `dev`: tylko z main i dopiero po zatwierdzeniu (ADR-0017).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "services/inference/**"
      - "packages/features/**"
      - "infra/terraform/envs/**"
      - "scripts/deploy_inference.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      build_image:
        description: "Zbuduj obraz z bieżącego commita (inaczej zostaje obraz obecnego championa)"
        type: boolean
        default: false

permissions:
  id-token: write # token OIDC → rola deploy w AWS
  contents: read

# Wdrożenia po kolei, nigdy równolegle; nowe nie przerywa trwającego.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  TF_DIR: infra/terraform/envs/dev
  LAMBDA_FUNCTION: ai-text-detector-inference
  ECR_REPOSITORY: ai-text-detector/inference

jobs:
  deploy:
    name: Wdrożenie dev
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # potrzebne do porównania z poprzednim commitem

      - name: Sprawdzenie konfiguracji
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Brak zmiennej AWS_DEPLOY_ROLE_ARN w Environment dev (Settings → Environments → dev → Environment variables)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Czy budować obraz?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BUILD_INPUT: ${{ inputs.build_image }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            build="$BUILD_INPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- services/inference packages/features; then
            build=false
          else
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Budowanie obrazu: $build"

      - name: Tag obrazu
        id: image
        env:
          BUILD: ${{ steps.decide.outputs.build }}
        run: |
          if [ "$BUILD" = "true" ]; then
            tag="${GITHUB_SHA::7}"
          else
            # ImageUri zwraca `get-function` (sekcja Code), nie `get-function-configuration`.
            uri=$(aws lambda get-function --function-name "$LAMBDA_FUNCTION" --qualifier champion \
                    --query Code.ImageUri --output text)
            tag="${uri##*:}"
          fi
          if [ -z "$tag" ] || [ "$tag" = "None" ]; then
            echo "::error::Nie udało się ustalić tagu obrazu."
            exit 1
          fi
          # Tagi w ECR są niezmienne — obraz z tym tagiem budujemy tylko, jeśli jeszcze go nie ma.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$tag" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          if [ "$BUILD" != "true" ] && [ "$exists" != "true" ]; then
            echo "::error::Obrazu $ECR_REPOSITORY:$tag nie ma w ECR."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "push=$([ "$BUILD" = "true" ] && [ "$exists" != "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag (w ECR: $exists)"

      - name: Logowanie do ECR
        if: steps.image.outputs.push == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3
        if: steps.image.outputs.push == 'true'

      - name: Build i push obrazu
        if: steps.image.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/inference/Dockerfile
          platforms: linux/amd64
          provenance: false # Lambda nie przyjmuje indeksów obrazów z atestacjami
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16.0"
          terraform_wrapper: false

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform -chdir="$TF_DIR" init -input=false
          terraform -chdir="$TF_DIR" plan -input=false -no-color -lock-timeout=120s \
            -var "inference_image_tag=${{ steps.image.outputs.tag }}" -out tfplan | tee plan.log
          summary=$(grep -E '^(Plan:|No changes\.)' plan.log | tail -1 || true)
          echo "summary=${summary:-tylko outputy}" >> "$GITHUB_OUTPUT"

      # Bezpiecznik: automat nigdy nie usuwa zasobów. Usunięcie = świadomy, ręczny apply.
      - name: Bezpiecznik — brak usuwania
        run: |
          if grep -Eq '[1-9][0-9]* to destroy' plan.log; then
            echo "::error::Plan usuwa zasoby — wdrożenie przerwane. Zrób apply ręcznie po przeglądzie planu."
            exit 1
          fi

      - name: terraform apply
        run: terraform -chdir="$TF_DIR" apply -input=false -no-color -lock-timeout=120s tfplan

      - name: Czy jest nowa wersja Lambdy?
        id: versions
        run: |
          model_uri=$(terraform -chdir="$TF_DIR" output -raw inference_model_uri)
          before=$(terraform -chdir="$TF_DIR" output -raw inference_version)
          latest=$(terraform -chdir="$TF_DIR" output -raw inference_latest_version)
          echo "model=$(basename "$model_uri")" >> "$GITHUB_OUTPUT"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform -chdir="$TF_DIR" output -raw evaluate_url)" >> "$GITHUB_OUTPUT"
          echo "Alias champion: $before, najnowsza wersja: $latest"

      # Tylko gdy apply opublikował nową wersję: bez tego klienci trafiliby na nierozgrzaną wersję.
      - uses: actions/setup-python@v5
        if: steps.versions.outputs.latest != steps.versions.outputs.before
        with:
          python-version: "3.12"

      - name: Rozgrzanie, test dymny i przełączenie aliasu
        id: promote
        if: steps.versions.outputs.latest != steps.versions.outputs.before
        run: |
          pip install --quiet boto3
          python scripts/deploy_inference.py --version "${{ steps.versions.outputs.latest }}" \
            --expect-model-version "${{ steps.versions.outputs.model }}"

      # Zawsze: ścieżka klienta (API Gateway → alias champion). Wykrywa też zmiany, które psują inference
      # bez nowej wersji Lambdy (IAM do S3, throttling, integracja API Gateway).
      - name: Test publicznego endpointu
        id: endpoint
        env:
          URL: ${{ steps.versions.outputs.url }}
          MODEL: ${{ steps.versions.outputs.model }}
        run: |
          text='Wczoraj wieczorem poszedłem do kina. Film był długi, ale bardzo ciekawy i dobrze zagrany. Po seansie rozmawialiśmy o nim jeszcze przez godzinę.'
          body=$(jq -cn --arg t "$text" '{text: $t}')
          for attempt in 1 2 3; do
            status=$(curl -sS -o response.json -w '%{http_code}' --max-time 35 \
                       -H 'content-type: application/json; charset=utf-8' -d "$body" "$URL" || echo 000)
            echo "Próba $attempt: HTTP $status"
            [ "$status" = "200" ] && break
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "::error::POST /evaluate zwrócił HTTP $status"; cat response.json || true; exit 1
          fi
          jq -e --arg m "$MODEL" '
            (.label == "ai" or .label == "human")
            and (.ai_probability >= 0 and .ai_probability <= 1)
            and (.explanation.top_features | length == 5)
            and .model_version == $m' response.json >/dev/null \
            || { echo "::error::Odpowiedź niezgodna z kontraktem"; cat response.json; exit 1; }
          echo "label=$(jq -r .label response.json)" >> "$GITHUB_OUTPUT"
          echo "processing_ms=$(jq -r .timing.processing_ms response.json)" >> "$GITHUB_OUTPUT"

          empty=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 35 \
                    -H 'content-type: application/json' -d '{"text": "   "}' "$URL")
          if [ "$empty" != "400" ]; then
            echo "::error::Pusty tekst powinien dać HTTP 400, jest $empty"; exit 1
          fi
          echo "Endpoint OK: $(jq -c '{label, ai_probability, model_version, timing}' response.json)"

      - name: Alias po wdrożeniu
        id: after
        if: always() && steps.versions.outcome == 'success'
        run: |
          after=$(aws lambda get-alias --function-name "$LAMBDA_FUNCTION" --name champion \
                    --query FunctionVersion --output text)
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Podsumowanie
        if: always()
        env:
          TAG: ${{ steps.image.outputs.tag }}
          PUSHED: ${{ steps.image.outputs.push }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
          BEFORE: ${{ steps.versions.outputs.before }}
          AFTER: ${{ steps.after.outputs.after }}
          MODEL: ${{ steps.versions.outputs.model }}
          PROMOTE: ${{ steps.promote.outcome }}
          ENDPOINT: ${{ steps.endpoint.outcome }}
          LABEL: ${{ steps.endpoint.outputs.label }}
          PROCESSING_MS: ${{ steps.endpoint.outputs.processing_ms }}
        run: |
          {
            echo "### Wdrożenie dev"
            echo "| | |"
            echo "|---|---|"
            echo "| Obraz | \`$TAG\` $([ "$PUSHED" = "true" ] && echo '(nowy)' || echo '(istniejący)') |"
            echo "| Terraform | ${SUMMARY:-—} |"
            echo "| Model | ${MODEL:-—} |"
            echo "| Alias \`champion\` | ${BEFORE:-?} → ${AFTER:-?} $([ "$PROMOTE" = "skipped" ] && echo '(bez nowej wersji — skrypt pominięty)') |"
            echo "| Test \`POST /evaluate\` | ${ENDPOINT:-—} ${LABEL:+($LABEL, ${PROCESSING_MS} ms)} |"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$AFTER" ]; then
              echo ""
              echo "Rollback: \`python scripts/deploy_inference.py --version $BEFORE\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
