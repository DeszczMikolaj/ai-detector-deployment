# Wdrożenie envs/dev po merge'u do main (albo ręcznie: Actions → Deploy → Run workflow).
#   1. build i push obrazu inference (tylko gdy zmienił się jego kod; tag = SHA commita),
#   2. terraform plan → bezpiecznik (nic nie może być usuwane) → apply,
#   3. scripts/deploy_inference.py: rozgrzanie nowej wersji, test dymny, przełączenie aliasu champion.
# Job działa w GitHub Environment `dev`: tylko z main i dopiero po zatwierdzeniu (ADR-0017).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "services/inference/**"
      - "packages/features/**"
      - "infra/terraform/envs/**"
      - "scripts/deploy_inference.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      build_image:
        description: "Zbuduj obraz z bieżącego commita (inaczej zostaje obraz obecnego championa)"
        type: boolean
        default: false

permissions:
  id-token: write # token OIDC → rola deploy w AWS
  contents: read

# Wdrożenia po kolei, nigdy równolegle; nowe nie przerywa trwającego.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  TF_DIR: infra/terraform/envs/dev
  LAMBDA_FUNCTION: ai-text-detector-inference
  ECR_REPOSITORY: ai-text-detector/inference

jobs:
  deploy:
    name: Wdrożenie dev
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # potrzebne do porównania z poprzednim commitem

      - name: Sprawdzenie konfiguracji
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Brak zmiennej AWS_DEPLOY_ROLE_ARN w Environment dev (Settings → Environments → dev → Environment variables)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Czy budować obraz?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BUILD_INPUT: ${{ inputs.build_image }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            build="$BUILD_INPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- services/inference packages/features; then
            build=false
          else
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Budowanie obrazu: $build"

      - name: Tag obrazu
        id: image
        env:
          BUILD: ${{ steps.decide.outputs.build }}
        run: |
          if [ "$BUILD" = "true" ]; then
            tag="${GITHUB_SHA::7}"
          else
            # ImageUri zwraca `get-function` (sekcja Code), nie `get-function-configuration`.
            uri=$(aws lambda get-function --function-name "$LAMBDA_FUNCTION" --qualifier champion \
                    --query Code.ImageUri --output text)
            tag="${uri##*:}"
          fi
          if [ -z "$tag" ] || [ "$tag" = "None" ]; then
            echo "::error::Nie udało się ustalić tagu obrazu."
            exit 1
          fi
          # Tagi w ECR są niezmienne — obraz z tym tagiem budujemy tylko, jeśli jeszcze go nie ma.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$tag" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          if [ "$BUILD" != "true" ] && [ "$exists" != "true" ]; then
            echo "::error::Obrazu $ECR_REPOSITORY:$tag nie ma w ECR."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "push=$([ "$BUILD" = "true" ] && [ "$exists" != "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag (w ECR: $exists)"

      - name: Logowanie do ECR
        if: steps.image.outputs.push == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3
        if: steps.image.outputs.push == 'true'

      - name: Build i push obrazu
        if: steps.image.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/inference/Dockerfile
          platforms: linux/amd64
          provenance: false # Lambda nie przyjmuje indeksów obrazów z atestacjami
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16.0"
          terraform_wrapper: false

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform -chdir="$TF_DIR" init -input=false
          terraform -chdir="$TF_DIR" plan -input=false -no-color -lock-timeout=120s \
            -var "inference_image_tag=${{ steps.image.outputs.tag }}" -out tfplan | tee plan.log
          summary=$(grep -E '^(Plan:|No changes\.)' plan.log | tail -1 || true)
          echo "summary=${summary:-tylko outputy}" >> "$GITHUB_OUTPUT"

      # Bezpiecznik: automat nigdy nie usuwa zasobów. Usunięcie = świadomy, ręczny apply.
      - name: Bezpiecznik — brak usuwania
        run: |
          if grep -Eq '[1-9][0-9]* to destroy' plan.log; then
            echo "::error::Plan usuwa zasoby — wdrożenie przerwane. Zrób apply ręcznie po przeglądzie planu."
            exit 1
          fi

      - name: terraform apply
        run: terraform -chdir="$TF_DIR" apply -input=false -no-color -lock-timeout=120s tfplan

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rozgrzanie, test dymny i przełączenie aliasu
        id: promote
        run: |
          pip install --quiet boto3
          model_uri=$(terraform -chdir="$TF_DIR" output -raw inference_model_uri)
          model_version=$(basename "$model_uri")
          before=$(terraform -chdir="$TF_DIR" output -raw inference_version)
          python scripts/deploy_inference.py --expect-model-version "$model_version"
          after=$(aws lambda get-alias --function-name "$LAMBDA_FUNCTION" --name champion \
                    --query FunctionVersion --output text)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "model=$model_version" >> "$GITHUB_OUTPUT"

      - name: Podsumowanie
        if: always()
        env:
          TAG: ${{ steps.image.outputs.tag }}
          PUSHED: ${{ steps.image.outputs.push }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
          BEFORE: ${{ steps.promote.outputs.before }}
          AFTER: ${{ steps.promote.outputs.after }}
          MODEL: ${{ steps.promote.outputs.model }}
        run: |
          {
            echo "### Wdrożenie dev"
            echo "| | |"
            echo "|---|---|"
            echo "| Obraz | \`$TAG\` $([ "$PUSHED" = "true" ] && echo '(nowy)' || echo '(istniejący)') |"
            echo "| Terraform | ${SUMMARY:-—} |"
            echo "| Model | ${MODEL:-—} |"
            echo "| Alias \`champion\` | ${BEFORE:-?} → ${AFTER:-?} |"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$AFTER" ]; then
              echo ""
              echo "Rollback: \`python scripts/deploy_inference.py --version $BEFORE\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
