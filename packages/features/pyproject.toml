[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "detector-features"
version = "0.1.0"
description = "Ekstrakcja 38 cech stylometrycznych — jedyne źródło cech dla treningu i inference (ADR-0002, ADR-0015)."
requires-python = ">=3.12"
dependencies = [
    "spacy==3.8.13",
    "numpy>=1.26",
    "networkx>=3.0",
    "ts2vg>=1.2",
]
# Model językowy (pl_core_news_md 3.8.0) nie jest na PyPI — instalacja: patrz README.md.

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
